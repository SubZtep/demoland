<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>▦</title>
  <style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; cursor: none;
    touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; }
  canvas { display: block; touch-action: none; }
  .info.touch { display: none; }
  .info {
    position: fixed; left: 16px; bottom: 16px;
    color: #fff; font-family: sans-serif; font-size: 13px;
    opacity: 0.5; text-shadow: 0 0 5px #000;
  }
  .glow {
    position: fixed; left: 0; top: 0;
    width: 14px; height: 14px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 100;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, #ffeebb 0%, transparent 70%);
    mix-blend-mode: screen;
    box-shadow: 0 0 18px #ffd699;
  }

  .score { position: fixed; top: 16px; left: 16px; color: #fff; font-family: -apple-system, sans-serif;
    font-size: 17px; text-shadow: 0 0 10px rgba(255,140,220,0.9); user-select: none;
    pointer-events: none; z-index: 300; letter-spacing: 1px; }
  .target { position: fixed; width: 38px; height: 38px; border-radius: 50%;
    pointer-events: none; transform: translate(-50%, -50%);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; z-index: 60; will-change: left, top, transform; mix-blend-mode: screen;
    transition: transform 0.18s ease-out; }
  .target::before { content: ''; position: absolute; inset: -4px; border-radius: 50%;
    background: radial-gradient(circle, currentColor 0%, transparent 70%); opacity: 0.7; }
  .target.locked { transform: translate(-50%, -50%) scale(1.45); }
  .target.locked::after { content: ''; position: absolute; inset: -14px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.8);
    animation: lockPulse 0.45s ease-in-out infinite alternate; }
  @keyframes lockPulse { from { transform: scale(0.85); opacity: 0.6; }
    to { transform: scale(1.15); opacity: 1; } }
  .reticle { position: fixed; width: 70px; height: 70px; pointer-events: none;
    transform: translate(-50%, -50%); z-index: 250; mix-blend-mode: screen; }
  .reticle .dot { fill: rgba(255,255,255,0.9); transition: r 0.12s; }
  .reticle.locked .dot { fill: rgba(255,120,220,1); animation: dotPulse 0.4s ease-in-out infinite alternate; }
  @keyframes dotPulse { from { r: 4; } to { r: 9; } }
  .particle { position: fixed; width: 7px; height: 7px; border-radius: 50%;
    pointer-events: none; z-index: 500; transform: translate(-50%, -50%);
    animation: partFly 0.85s ease-out forwards; mix-blend-mode: screen; }
  @keyframes partFly {
    to { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))); opacity: 0; } } 

  .combo { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
    font-family: -apple-system, sans-serif; font-size: 80px; font-weight: 900;
    color: #fff; text-shadow: 0 0 24px #ff66dd, 0 0 48px #6644ff;
    pointer-events: none; opacity: 0; z-index: 350; letter-spacing: 4px;
    transition: opacity 0.2s, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .combo.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .achievement { position: fixed; top: 25%; left: 50%; transform: translate(-50%, -50%);
    font-family: -apple-system, sans-serif; font-size: 22px; padding: 12px 28px;
    color: #fff; text-shadow: 0 0 16px #ffd700;
    background: linear-gradient(90deg, rgba(255,180,0,0.2), rgba(255,80,200,0.2));
    border: 1.5px solid rgba(255,220,100,0.7); border-radius: 30px;
    pointer-events: none; opacity: 0; z-index: 360; letter-spacing: 2px;
    backdrop-filter: blur(8px);
    transition: opacity 0.4s, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .achievement.show { opacity: 1; transform: translate(-50%, -80%); }
  #scoreNum { display: inline-block; transition: color 0.2s; }
  #scoreNum.puff { animation: numPuff 0.45s ease-out; }
  @keyframes numPuff {
    0%   { transform: scale(1);   color: #fff; }
    30%  { transform: scale(1.7); color: gold; text-shadow: 0 0 20px gold; }
    100% { transform: scale(1);   color: #fff; } }
  .target.golden { font-size: 30px; animation: goldenPulse 1.2s ease-in-out infinite; }
  @keyframes goldenPulse {
    0%,100% { filter: drop-shadow(0 0 8px gold); }
    50%     { filter: drop-shadow(0 0 20px gold) drop-shadow(0 0 36px orange); } }

  .cooldown { position: fixed; width: 84px; height: 84px; pointer-events: none;
    transform: translate(-50%, -50%); z-index: 245; mix-blend-mode: screen; }
  .cooldown .cd-ring { stroke-dasharray: 210; stroke-dashoffset: 210;
    transition: stroke-dashoffset 1.45s linear, stroke 0.15s, stroke-width 0.15s; }
  .cooldown .cd-ring.fill { stroke-dashoffset: 0; }
  .cooldown.critical .cd-ring { animation: criticalBlink 0.18s linear infinite alternate; }
  @keyframes criticalBlink { from { stroke-width: 3; opacity: 1; } to { stroke-width: 4.5; opacity: 0.6; } }

  .target.dodging { animation: dodgeHop 0.9s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 70; filter: drop-shadow(0 0 16px currentColor); }
  @keyframes dodgeHop {
    0%   { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; }
    15%  { transform: translate(calc(-50% + 0px), calc(-50% - 18px)) scale(0.7) rotate(-12deg); opacity: 0.9; }
    40%  { transform: translate(calc(-50% + 6px), calc(-50% + 0px)) scale(1.15) rotate(8deg); opacity: 1; }
    70%  { transform: translate(calc(-50% - 4px), calc(-50% + 4px)) scale(0.95) rotate(-4deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; } }
  .target.dodging::before { animation: dodgeGlow 0.9s ease-out; }
  @keyframes dodgeGlow {
    0%   { opacity: 0.7; transform: scale(1); }
    50%  { opacity: 1.5; transform: scale(1.4); }
    100% { opacity: 0.7; transform: scale(1); } }

  .reticle.aim .dot { animation: aimDot 0.12s ease-in-out infinite alternate; }
  @keyframes aimDot { from { r: 4; } to { r: 7; } }

  .big-fish { position: fixed; pointer-events: none; z-index: 600;
    transform: translate(-50%, -50%) scale(0) rotate(0);
    mix-blend-mode: screen; opacity: 0;
    filter: drop-shadow(0 0 28px gold) drop-shadow(0 0 60px rgba(255,180,80,0.7));
    animation: bigFishAppear 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  @keyframes bigFishAppear {
    0%   { transform: translate(-50%, -50%) scale(0.2) rotate(-160deg); opacity: 0; }
    25%  { transform: translate(-50%, -50%) scale(1.35) rotate(0deg); opacity: 1; }
    55%  { transform: translate(-50%, -50%) scale(1.05) rotate(15deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0.4) rotate(70deg); opacity: 0; } }
  /* glow periodikus pulzálás */
  .glow { animation: glowBreathe 4.5s ease-in-out infinite; }
  @keyframes glowBreathe {
    0%, 70%, 100% { transform: translate(-50%, -50%) scale(1); }
    78% { transform: translate(-50%, -50%) scale(1.7); }
    86% { transform: translate(-50%, -50%) scale(1.7); } }

  @media (hover: none) and (pointer: coarse) {
    html, body { cursor: auto; }
    .target { width: 48px; height: 48px; font-size: 26px; }
    .info.touch { display: block; font-size: 11px; right: 16px; }
    .info.mouse { display: none; }
    .combo { font-size: 56px; }
    .achievement { font-size: 17px; padding: 10px 20px; max-width: 86vw; text-align: center; }
  }
</style>
</head>

<svg class="reticle" id="reticle" viewBox="0 0 64 64">

  <path d="M32 4 L32 16 M32 48 L32 60 M4 32 L16 32 M48 32 L60 32" stroke="rgba(255,255,255,0.7)" stroke-width="1.4" stroke-linecap="round"/>

</svg>

</svg>

<div class="score">ELKAPVA · <span id="scoreNum">0</span></div>

<div class="info mouse">mozgasd az egeret — a pupilla követi · move mouse · pupil follows</div>
<div class="info touch">érintsd meg és húzd · koppints a célpontra · touch and drag · tap to catch</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000208);
scene.fog = new THREE.FogExp2(0x000208, 0.055);

const camera = new THREE.PerspectiveCamera(80, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0,0,0);

const renderer = new THREE.WebGLRenderer();
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.80;
document.body.appendChild(renderer.domElement);

// Audio
let analyser = null;
let droneOscs = [], droneBaseFreqs = [], droneHighFreqs = [];
let droneMaster = null, droneSparkGain = null, droneSparkFilter = null;
const dataArr = new Uint8Array(128);
function startAudio(){
  if (analyser) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const baseFreqs  = [110, 165, 220, 277];
    const highFreqs  = [146, 220, 293, 391]; // ~5/3 arányban magasabb
    const freqs = baseFreqs.slice();
    const oscs = freqs.map(f => { const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f; return o; });
    droneOscs = oscs;
    droneBaseFreqs = baseFreqs;
    droneHighFreqs = highFreqs;
    const master = ctx.createGain(); master.gain.value = 0.035;
    droneMaster = master;
    oscs.forEach(o => o.connect(master));
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.15;
    const lfoGain = ctx.createGain(); lfoGain.gain.value = 0.022;
    lfo.connect(lfoGain).connect(master.gain);
    analyser = ctx.createAnalyser(); analyser.fftSize = 256;
    master.connect(analyser); master.connect(ctx.destination);
    oscs.forEach(o => o.start()); lfo.start();
    droneSparkFilter = ctx.createBiquadFilter();
    droneSparkFilter.type = 'lowpass';
    droneSparkFilter.frequency.value = 400;
    droneSparkFilter.Q.value = 2;
    droneSparkGain = ctx.createGain(); droneSparkGain.gain.value = 0.0;
    const sparkOsc = ctx.createOscillator();
    sparkOsc.type = 'triangle';
    sparkOsc.frequency.value = 880;
    sparkOsc.connect(droneSparkFilter).connect(droneSparkGain).connect(ctx.destination);
    sparkOsc.start();
  } catch(e){}
}
function tryCatch(cx, cy){
  startAudio();
  const locked = targets.find(t => t.classList.contains('locked'));
  if (locked){
    explodeTarget(locked);
    const i = targets.indexOf(locked);
    if (i>=0) targets.splice(i,1);
    score++; scoreEl.textContent = score;
    setTimeout(spawnTarget, 500+Math.random()*300);
  } else {
    for (let i=0;i<4;i++){
      const p=document.createElement('div'); p.className='particle';
      p.style.left=cx+'px'; p.style.top=cy+'px'; p.style.background='#aaa';
      const ang=Math.random()*Math.PI*2; const dist=22+Math.random()*16;
      p.style.setProperty('--tx',Math.cos(ang)*dist+'px'); p.style.setProperty('--ty',Math.sin(ang)*dist+'px');
      document.body.appendChild(p); setTimeout(()=>p.remove(),650);
    }
  }
}
addEventListener('click', () => tryCatch(cursorPx.x, cursorPx.y), { once:false });
addEventListener('keydown', startAudio, { once:true });

addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  setCursor(t.clientX, t.clientY);
}, { passive:false });
addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  setCursor(t.clientX, t.clientY);
}, { passive:false });
addEventListener('touchend', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  setCursor(t.clientX, t.clientY);
  tryCatch(t.clientX, t.clientY);
}, { passive:false });
function getPulse(t){
  if (!analyser) return 0.5 + 0.5*Math.sin(t*0.45);
  analyser.getByteFrequencyData(dataArr);
  let s = 0; for (let i = 0; i < 8; i++) s += dataArr[i];
  return s / (8 * 255);
}

// Cső — uCursor uniform hozzáadva
const R = 6;
const tunnelGeom = new THREE.CylinderGeometry(R, R, 400, 64, 200, true);
const tunnelMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    uTime:   { value: 0 },
    uPulse:  { value: 0 },
    uCursor: { value: new THREE.Vector2(0, 0) }
  },
  vertexShader: `varying vec3 vPos; varying vec4 vClip; void main(){ vPos=position; vec4 c = projectionMatrix * modelViewMatrix * vec4(position,1.0); vClip = c; gl_Position = c; }`,
  fragmentShader: `
    uniform float uTime, uPulse;
    uniform vec2 uCursor;
    varying vec3 vPos;
    varying vec4 vClip;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float hash3(vec3 p) { return fract(sin(dot(p, vec3(12.9898, 78.233, 37.719))) * 43758.5453); }

    void main(){
      vec2 ndc = vClip.xy / vClip.w;

      // Eye koordináták — a kurzorhoz relatív
      vec2 eye = ndc - uCursor;
      float rEye = length(eye);
      float ang  = atan(eye.y, eye.x);

      // Pupilla — most a kurzornál van
      float pupilR = 0.14 + uPulse*0.035 + sin(uTime*0.6)*0.010;
      float pupil = smoothstep(pupilR+0.025, pupilR-0.025, rEye);

      // Sugarak — a kurzor körül
      float r1 = sin(ang*64.0 + uTime*0.25);
      float r2 = sin(ang*28.0 - uTime*0.18);
      float r3 = sin(ang*12.0 + uTime*0.10);
      float r4 = sin(ang*4.0 - uTime*0.06);
      float rays = r1*0.32 + r2*0.28 + r3*0.22 + r4*0.18;
      rays = rays * 0.5 + 0.5;
      rays = smoothstep(0.20, 0.90, rays);

      // Iris színek (a kurzor körül)
      vec3 i1 = vec3(0.22, 0.42, 0.65);
      vec3 i2 = vec3(0.38, 0.30, 0.58);
      vec3 i3 = vec3(0.48, 0.35, 0.52);
      vec3 i4 = vec3(0.30, 0.50, 0.62);
      vec3 i5 = vec3(0.42, 0.36, 0.45);
      vec3 irisCol = mix(i1, i2, smoothstep(0.3, 0.7, sin(ang*1.5+uTime*0.18)*0.5+0.5));
      irisCol = mix(irisCol, i3, smoothstep(0.3, 0.7, sin(ang*2.5-uTime*0.13)*0.5+0.5));
      irisCol = mix(irisCol, i4, smoothstep(0.3, 0.7, sin(ang*4.0+uTime*0.25)*0.5+0.5));
      irisCol = mix(irisCol, i5, smoothstep(0.3, 0.7, sin(ang*6.0-uTime*0.32)*0.5+0.5));

      // Hosszanti csíkok a cső mentén
      float z = vPos.y;
      float zStripe = smoothstep(0.35, 0.65, fract(z*0.18 + uTime*0.18));
      float zBase = mix(0.45, 1.0, zStripe);
      float texNoise = hash3(vPos * 8.0 + uTime*0.5);
      zBase *= 0.80 + texNoise * 0.40;

      // Iris kifelé halványul (a kurzortól)
      float fadeIris = smoothstep(1.6, 0.40, rEye);

      // Iris színezés
      vec3 irisRender = irisCol * rays;
      irisRender *= 0.40 + uPulse * 0.35;
      irisRender *= mix(0.25, 1.0, fadeIris) * zBase;
      irisRender = mix(irisRender, vec3(0.0), pupil);

      // Catchlight a kurzor közelében (a pupilla melletti kis csillogás)
      vec2 clPos = eye - vec2(-0.04, 0.05);
      float catchlight = exp(-pow(length(clPos)*7.0, 2.0)) * 0.85;

      // A cső távolabbi részein halvány hosszanti csíkok jelennek meg
      float backFade = smoothstep(0.45, 1.2, rEye);
      vec3 stripeCol = vec3(0.30, 0.40, 0.65) * 0.18 * zBase * backFade;

      vec3 col = irisRender + stripeCol;
      col += vec3(catchlight) * (1.0 - pupil*0.3) * (1.0 - smoothstep(0.0, 0.15, rEye)*0.5);

      // CA a teljes képernyőn (NDC alapú, mint eddig)
      float rNdc = length(ndc);
      float caShift = smoothstep(0.2, 1.0, rNdc) * 0.08;
      col.r *= 1.0 + caShift*0.6;
      col.b *= 1.0 - caShift*0.6;
      col.g *= 1.0 - caShift*0.15;

      // Vignette
      float vig = smoothstep(1.4, 0.20, rNdc);
      col *= mix(0.20, 1.0, vig);

      // Film grain
      vec2 screenPx = (ndc*0.5 + 0.5) * 800.0;
      float grain = hash(screenPx + vec2(uTime*73.0, uTime*41.0)) - 0.5;
      col += grain * 0.07;

      gl_FragColor = vec4(col, 1.0);
    }`
});
const tunnel = new THREE.Mesh(tunnelGeom, tunnelMat);
tunnel.rotation.x = Math.PI/2;
scene.add(tunnel);

// További objektumok (gyűrűk, csillagok, por) — változatlanok
const rings = [];
for (let i = 0; i < 60; i++) {
  const radius = R*0.88 - Math.random()*0.4;
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(radius, 0.04 + Math.random()*0.05, 8, 48),
    new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL(Math.random(), 0.7, 0.45), transparent: true, opacity: 0.75 })
  );
  ring.position.z = -i*4.5;
  ring.userData.baseSpeed = 0.15 + Math.random()*0.10;
  ring.userData.phase = Math.random()*Math.PI*2;
  scene.add(ring);
  rings.push(ring);
}

const polys = [];
const geometries = [ new THREE.TetrahedronGeometry(0.16), new THREE.OctahedronGeometry(0.14), new THREE.BoxGeometry(0.18, 0.18, 0.18) ];
for (let i = 0; i < 30; i++) {
  const g = geometries[i % 3];
  const m = new THREE.MeshBasicMaterial({
    color: new THREE.Color().setHSL(Math.random(), 0.7, 0.5),
    transparent: true, opacity: 0.7, wireframe: Math.random() > 0.5
  });
  const p = new THREE.Mesh(g, m);
  const ang = Math.random()*Math.PI*2;
  const rr = (0.3 + Math.random()*0.6) * R;
  p.position.set(Math.cos(ang)*rr, Math.sin(ang)*rr, -i*5 - Math.random()*5);
  p.userData = { spin: 0.005+Math.random()*0.02, spin2: 0.005+Math.random()*0.015, spin3: 0.005+Math.random()*0.01, bobPhase: Math.random()*Math.PI*2, speed: 0.07+Math.random()*0.07 };
  scene.add(p);
  polys.push(p);
}

const beamParticles = [];
const beamGeo = new THREE.SphereGeometry(0.13, 6, 6);
for (let i = 0; i < 55; i++) {
  const hue = 0.55 + Math.random()*0.4;
  const m = new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL(hue, 0.95, 0.70), transparent: true, opacity: 0.85 });
  const s = new THREE.Mesh(beamGeo, m);
  const ang = Math.random()*Math.PI*2;
  const rr = R*0.72 + Math.random()*R*0.14;
  s.position.set(Math.cos(ang)*rr, Math.sin(ang)*rr, -Math.random()*130);
  s.userData.speed = 0.18 + Math.random()*0.15;
  scene.add(s);
  beamParticles.push(s);
}

const bgStars = [];
const bgGeo = new THREE.SphereGeometry(0.05, 4, 4);
for (let i = 0; i < 500; i++) {
  const m = new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL(0.55 + Math.random()*0.35, 0.6, 0.5), transparent: true, opacity: 0.6 });
  const s = new THREE.Mesh(bgGeo, m);
  const ang = Math.random()*Math.PI*2;
  const rr = Math.sqrt(Math.random())*R*0.65;
  s.position.set(Math.cos(ang)*rr, Math.sin(ang)*rr, -Math.random()*200);
  s.userData.phase = Math.random()*Math.PI*2;
  s.userData.freq = 0.6 + Math.random()*1.8;
  s.userData.speed = 0.002 + Math.random()*0.015;
  scene.add(s);
  bgStars.push(s);
}

const fgStars = [];
const fgGeo = new THREE.SphereGeometry(0.10, 6, 6);
for (let i = 0; i < 40; i++) {
  const m = new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL(0.55+Math.random()*0.35, 0.8, 0.6), transparent: true, opacity: 0.85 });
  const s = new THREE.Mesh(fgGeo, m);
  const ang = Math.random()*Math.PI*2;
  const rr = Math.sqrt(Math.random())*R*1.2;
  s.position.set(Math.cos(ang)*rr, Math.sin(ang)*rr, -2 - Math.random()*12);
  s.userData.phase = Math.random()*Math.PI*2;
  s.userData.freq = 0.5 + Math.random()*1.0;
  s.userData.speed = 0.06 + Math.random()*0.06;
  scene.add(s);
  fgStars.push(s);
}

const dustCount = 250;
const dustPos = new Float32Array(dustCount * 3);
const dustUserData = [];
for (let i = 0; i < dustCount; i++) {
  const ang = Math.random()*Math.PI*2;
  const rr = Math.random()*9;
  dustPos[i*3] = Math.cos(ang)*rr;
  dustPos[i*3+1] = Math.sin(ang)*rr;
  dustPos[i*3+2] = -Math.random()*18 + 1;
  dustUserData.push({ spd: 0.04 + Math.random()*0.08, phase: Math.random()*Math.PI*2 });
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));

// GLOW a kurzor felett (a pupilla közelében meleg fény)
const glow = document.getElementById('glow');
const scoreEl = document.getElementById("scoreNum");
let score = 0;
const comboDisplay = document.getElementById('comboDisplay');
const achDisplay   = document.getElementById('achDisplay');
let combo = 0;
let comboTimeoutId = null;
let lastHitAt = 0;
const HALF_SEC = 1500;
let nextAch  = 5;
const ACHS = { 5: '★ ELSŐ VÉR ★', 10: '★ HALADÓ VADÁSZ ★',
               20: '★ MESTER ★', 35: '★ LEGENDÁS ★',
               50: '★ ISTEN MÓD ★', 75: '★ TRANSZCENDENS ★',
               100: '✦ UDVARIASS A KOSZMOSZHOZ ✦' };
let audioCtx = null;
function ensureAudio(){
  if (audioCtx) return audioCtx;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  catch(e){ audioCtx = null; }
  return audioCtx;
}
function blip(freq, dur, vol=0.18, type='sine'){
  const ctx = ensureAudio(); if (!ctx) return;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, ctx.currentTime);
  g.gain.linearRampToValueAtTime(vol, ctx.currentTime + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
  o.connect(g).connect(ctx.destination);
  o.start(); o.stop(ctx.currentTime + dur);
}
function updateDrone(combo){
  if (!audioCtx || !droneOscs.length) return;
  const blend = Math.min(Math.max((combo - 1) / 9, 0), 1); // 1..10+
  const t = audioCtx.currentTime;
  for (let i = 0; i < droneOscs.length; i++){
    const f = droneBaseFreqs[i] * (1-blend) + droneHighFreqs[i] * blend;
    droneOscs[i].frequency.linearRampToValueAtTime(f, t + 0.18);
  }
  if (droneMaster){
    const v = 0.035 + blend*0.020;
    droneMaster.gain.linearRampToValueAtTime(v, t + 0.25);
  }
  if (droneSparkGain){
    let mix = 0;
    if (combo >= 5) mix = 0.10;   if (combo >= 10) mix = 0.18;
    if (combo >= 20) mix = 0.24;
    droneSparkGain.gain.linearRampToValueAtTime(mix, t + 0.2);
  }
  if (droneSparkFilter){
    droneSparkFilter.frequency.linearRampToValueAtTime(800 + blend*2400, t + 0.2);
  }
}

function bigFishEffect(x, y) {
  const el = document.createElement('div');
  el.className = 'big-fish';
  el.style.left = x + 'px';
  el.style.top  = y + 'px';
  el.textContent = '🐟';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1200);
  // splash hang
  blip(180, 0.10, 0.22, 'square');
  setTimeout(() => blip(280, 0.14, 0.18, 'sawtooth'), 40);
  setTimeout(() => blip(140, 0.18, 0.16, 'triangle'), 80);
  // extra splash-részecskék (hal-pikkely formában)
  for (let i = 0; i < 10; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = x + 'px'; p.style.top = y + 'px';
    const hue = [45, 50, 200][i % 3];
    p.style.background = `hsl(${hue}, 100%, 70%)`;
    p.style.boxShadow = `0 0 18px currentColor`;
    p.style.width = '10px'; p.style.height = '10px';
    const ang = Math.random() * Math.PI * 2;
    const dist = 80 + Math.random() * 80;
    p.style.setProperty('--tx', Math.cos(ang) * dist + 'px');
    p.style.setProperty('--ty', Math.sin(ang) * dist + 'px');
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 950);
  }
}
function fanfare(){
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => blip(f, 0.18, 0.22, 'triangle'), i*70));
}
function showCombo(n){
  if (n < 2) return;
  const m = n >= 10 ? 'MEGA!!' : n >= 5 ? 'SZUPER' : n >= 3 ? 'SZÉP' : '';
  comboDisplay.textContent = '×' + n + (m ? '  ' + m : '');
  comboDisplay.classList.remove('show');
  void comboDisplay.offsetWidth;
  comboDisplay.classList.add('show');
  setTimeout(() => comboDisplay.classList.remove('show'), 700);
}
function showAchievement(text){
  achDisplay.textContent = text;
  achDisplay.classList.remove('show');
  void achDisplay.offsetWidth;
  achDisplay.classList.add('show');
  setTimeout(() => achDisplay.classList.remove('show'), 1800);
}
function awardScore(basePts, isGolden, wasDodging){
  const now = performance.now();

  if (now - lastHitAt < HALF_SEC) {
    combo++;
  } else {
    combo = 1;
  }
  lastHitAt = now;
  clearTimeout(comboTimeoutId);
  comboTimeoutId = setTimeout(() => { combo = 0; drainCooldown(); }, HALF_SEC);
  const multiplier = combo >= 10 ? 3 : combo >= 5 ? 2 : 1;
  const goldenBonus = isGolden ? 5 : 0;
  const catchBonus = wasDodging ? 2 : 0;
  const total = (basePts + goldenBonus + catchBonus) * multiplier;
  if (wasDodging && combo > 0) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.textContent = 'SHARP! +' + (catchBonus * multiplier);
      Object.assign(el.style, {
        position: 'fixed', left: scoreEl.getBoundingClientRect().left + 'px',
        top: scoreEl.getBoundingClientRect().top + 'px',
        color: '#ffd700', fontWeight: '900', fontSize: '22px',
        textShadow: '0 0 16px gold', zIndex: '380', pointerEvents: 'none',
        transition: 'transform 0.7s, opacity 0.7s'
      });
      document.body.appendChild(el);
      requestAnimationFrame(() => {
        el.style.transform = 'translateY(-46px)';
        el.style.opacity = '0';
      });
      setTimeout(() => el.remove(), 750);
      blip(1200 + combo*40, 0.08, 0.20, 'square');
    }, 30);
  }
  score += total;
  scoreEl.textContent = score;
  refillCooldown(combo);
  scoreEl.classList.remove('puff');
  void scoreEl.offsetWidth;
  scoreEl.classList.add('puff');
  // hang
  const baseFreq = isGolden ? 660 : 440;
  blip(baseFreq + combo * 60, 0.10, 0.18, 'sine');
  if (multiplier > 1){
    setTimeout(() => blip(baseFreq + combo * 60 + 200, 0.12, 0.15, 'triangle'), 50);
  }
  // combo felirat
  showCombo(combo);
  // achievement
  while (nextAch <= score && ACHS[nextAch]){
    showAchievement(ACHS[nextAch]);
    fanfare();
    nextAch += ACHS[nextAch + 1] ? 1 : 999;
  }
  return total;
}
const targets = [];
const TARGET_EMOJIS = ["🐟","🌟","🦋","🐙","🌸","🍄","🪼","🐠","🪐","🦑"];

function spawnTarget(){
  if (targets.length >= 6) return; // ne legyen túl sok élő célpont
  const t = document.createElement("div");
  t.className = "target";
  const isGolden = Math.random() < 0.10;
  if (isGolden) t.classList.add("golden");
  const m = 8;
  t.style.left = (m + Math.random()*(100-m*2)) + "vw";
  t.style.top  = (m + Math.random()*(100-m*2)) + "vh";
  t.style.color = isGolden ? "hsl(45,100%,60%)" : "hsl(" + (Math.random()*360|0) + ",90%,65%)";
  t.textContent = isGolden ? "✨" : TARGET_EMOJIS[(Math.random()*TARGET_EMOJIS.length)|0];
  t.userData = { vx:(Math.random()-0.5)*0.04, vy:(Math.random()-0.5)*0.04,
    phase:Math.random()*Math.PI*2, dodgeCd: 1.5 + Math.random()*2.5,
    dodgedHits: 0, isDodging: false, dodgeTargetX: 0, dodgeTargetY: 0,
    dodgeFrames: 0, lastDist: 999 };
  document.body.appendChild(t); targets.push(t);
}
function explodeTarget(t, intensity, isSharpCatch){
  intensity = intensity || 1;
  const r = t.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  bigFishEffect(cx, cy);
  const isGolden = t.classList.contains('golden');
  const baseCount = 14 + (isGolden ? 10 : 0);
  const count = Math.floor(baseCount + Math.max(0, intensity - 1) * 10);
  const distMul = 1 + Math.max(0, intensity - 1) * 0.6;
  const hueStart = Math.random() * 360;
  for (let i=0; i<count; i++){
    const p = document.createElement("div");
    p.className = "particle";
    p.style.left = cx+"px"; p.style.top = cy+"px";
    p.style.background = "hsl(" + ((hueStart + i*30)%360|0) + ",100%," + (60+Math.random()*30) + "%)";
    p.style.boxShadow = "0 0 14px currentColor";
    p.style.width = (6 + (intensity>=3?3:0) + Math.random()*3) + "px";
    p.style.height = p.style.width;
    const ang = (i/count)*Math.PI*2 + Math.random()*0.3;
    const dist = (60 + Math.random()*70) * distMul;
    p.style.setProperty("--tx", Math.cos(ang)*dist+"px");
    p.style.setProperty("--ty", Math.sin(ang)*dist+"px");
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 900);
  }
  // sharpCatch extra: koncentrikus gyűrű-részecskék
  if (isSharpCatch){
    for (let i=0; i<10; i++){
      const p = document.createElement("div");
      p.className = "particle";
      p.style.left = cx+"px"; p.style.top = cy+"px";
      p.style.background = "hsl(50,100%,80%)";
      p.style.boxShadow = "0 0 20px gold";
      p.style.width = "7px"; p.style.height = "7px";
      const ang = (i/10)*Math.PI*2;
      const dist = 120;
      p.style.setProperty("--tx", Math.cos(ang)*dist+"px");
      p.style.setProperty("--ty", Math.sin(ang)*dist+"px");
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 900);
    }
  }
  // "shockwave" sugarak combo >= 3
  if (intensity >= 2){
    const ringCount = Math.min(12, intensity * 4);
    for (let i=0; i<ringCount; i++){
      const p = document.createElement("div");
      p.className = "particle";
      p.style.left = cx+"px"; p.style.top = cy+"px";
      const hue = (hueStart + i*45) % 360;
      p.style.background = "hsl(" + hue + ",100%,80%)";
      p.style.boxShadow = "0 0 22px hsl(" + hue + ",100%,60%)";
      p.style.width = "10px"; p.style.height = "10px";
      const ang = (i/ringCount)*Math.PI*2;
      const dist = 80 * distMul;
      p.style.setProperty("--tx", Math.cos(ang)*dist+"px");
      p.style.setProperty("--ty", Math.sin(ang)*dist+"px");
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 900);
    }
  }
  t.remove();
}
for (let i=0; i<3; i++) spawnTarget();
let cursorPx = { x: innerWidth/2, y: innerHeight/2 };
const isDemo = new URLSearchParams(location.search).has('demo');
let demoTime = 0;
const __reticle = document.getElementById("reticle");
const __cursorPxShared = cursorPx;

function setCursor(px, py) {
  cursorPx.x = px; cursorPx.y = py;
  // NDC (NDC y felfelé nő, tehát negáljuk a pixel-y-t)
  const x = (px / innerWidth) * 2 - 1;
  const y = -((py / innerHeight) * 2 - 1);
  tunnelMat.uniforms.uCursor.value.set(x, y);
  // glow DOM pozíció
  glow.style.left = px + "px"; glow.style.top = py + "px";
  const reticle = document.getElementById("reticle");
  reticle.style.left = px + "px"; reticle.style.top = py + "px";
  glow.style.top  = py + 'px';
}
setCursor(innerWidth/2, innerHeight/2);

addEventListener('mousemove', e => setCursor(e.clientX, e.clientY));

const clock = new THREE.Clock();
function animate(){
  const t = clock.getElapsedTime();
  const tLoop = t % 4.0;

  if (isDemo) {
    let nearest = null, minDist = Infinity;
    for (const t of targets){
      const tx = parseFloat(t.style.left)/100 * innerWidth;
      const ty = parseFloat(t.style.top)/100 * innerHeight;
      const d = Math.hypot(tx - innerWidth/2, ty - innerHeight/2);
      if (d < minDist){ minDist = d; nearest = {x: tx, y: ty, t}; }
    }
    if (nearest && targets.length){
      // kurzor a legközelebbi célpont felé halad, majd "megeszi"
      const speed = 0.08;
      cursorPx.x += (nearest.x - cursorPx.x) * speed;
      cursorPx.y += (nearest.y - cursorPx.y) * speed;
      setCursor(cursorPx.x, cursorPx.y);
      // ha elég közel van, szimulált kattintás
      if (nearest.t.classList.contains('locked')){
        nearest.t.userData.lockTime = (nearest.t.userData.lockTime || 0) + 1;
        // Várjunk 8-12 frame-et, hogy a dodge esélye legyen látható
        if (nearest.t.userData.lockTime > 10 && nearest.t.userData.lockTime < 14) {
          // "majdnem" — pulzáljunk a reticle-en
          __reticle.classList.add('aim');
        }
        if ((nearest.t.userData.lockTime >= 14 || nearest.t.userData.lockTime > 30) && Math.random() < 0.30) {
          __reticle.classList.remove('aim');
          const wasGolden = nearest.t.classList.contains('golden');
          const wasDodging = nearest.t.classList.contains('dodging');
          explodeTarget(nearest.t, Math.max(combo, 1), wasDodging);
          const i = targets.indexOf(nearest.t);
          if (i>=0) targets.splice(i,1);
          awardScore(wasGolden ? 3 : 1, wasGolden, wasDodging);
          setTimeout(spawnTarget, 400+Math.random()*300);
        }
      } else {
        nearest.t.userData.lockTime = 0;
      }
    } else {
      demoTime += 0.012;
      const cx = innerWidth/2, cy = innerHeight/2;
      const r = Math.min(innerWidth, innerHeight)*0.22;
      setCursor(cx + Math.cos(demoTime)*r, cy + Math.sin(demoTime*0.7)*r*0.6);
    }
  }

  const pulse = getPulse(tLoop);
  tunnelMat.uniforms.uTime.value = tLoop;
  tunnelMat.uniforms.uPulse.value = pulse;
  tunnelMat.uniforms.uCursor.value.copy(tunnelMat.uniforms.uCursor.value);
  // === game logic ===
  const anyLocked = targets.some(t => t.classList.contains("locked"));
  __reticle.classList.toggle("locked", anyLocked);
  targets.forEach(t => {
    let lx = parseFloat(t.style.left);
    let ly = parseFloat(t.style.top);
    lx += t.userData.vx + Math.sin(performance.now()*0.001+t.userData.phase)*0.04;
    ly += t.userData.vy + Math.cos(performance.now()*0.0009+t.userData.phase)*0.04;
    if (lx<6){lx=6;t.userData.vx=Math.abs(t.userData.vx);}
    if (lx>94){lx=94;t.userData.vx=-Math.abs(t.userData.vx);}
    if (ly<6){ly=6;t.userData.vy=Math.abs(t.userData.vy);}
    if (ly>94){ly=94;t.userData.vy=-Math.abs(t.userData.vy);}
    t.style.left=lx+"vw"; t.style.top=ly+"vh";
    const dx = (lx/100*innerWidth) - cursorPx.x;
    const dy = (ly/100*innerHeight) - cursorPx.y;
    const dist = Math.hypot(dx,dy);
    if (dist<70) t.classList.add("locked"); else t.classList.remove("locked");

    // Sima lebegés — dodge kikapcsolva
    if (t.userData.isDodging) t.userData.isDodging = false;
    if (Math.random() < 0.0025) {
      t.classList.add('dodging');
      setTimeout(() => t.classList.remove('dodging'), 280);
      lx += (Math.random()-0.5) * 1.8;
      ly += (Math.random()-0.5) * 1.8;
    }
  });

  // FOV pulzálás
  camera.fov = 78 + pulse*0.8 + Math.sin(tLoop*0.15)*0.5 - Math.sin(tLoop*0.2)*1.5;
  camera.updateProjectionMatrix();

  rings.forEach(r => {
    r.position.z += r.userData.baseSpeed;
    if (r.position.z > 6) r.position.z -= 60*4.5;
    const s = 1 + pulse*0.08;
    r.scale.set(s, s, 1);
    r.rotation.z = r.userData.phase + r.position.z*0.05;
  });

  polys.forEach(p => {
    p.position.z += p.userData.speed;
    if (p.position.z > 4) p.position.z -= 30*5;
    p.rotation.x += p.userData.spin;
    p.rotation.y += p.userData.spin2;
    p.rotation.z += p.userData.spin3;
    p.position.y += Math.sin(tLoop*1.2 + p.userData.bobPhase)*0.004;
    const s = 0.9 + pulse*0.15;
    p.scale.set(s, s, s);
  });

  beamParticles.forEach(s => {
    s.position.z += s.userData.speed;
    if (s.position.z > 4) s.position.z -= 130;
    s.material.opacity = 0.60 + pulse*0.35;
  });

  bgStars.forEach(s => {
    s.position.z += s.userData.speed;
    if (s.position.z > 6) s.position.z -= 200;
    const tw = 0.5 + 0.5*Math.sin(tLoop*s.userData.freq + s.userData.phase);
    s.material.opacity = 0.10 + tw*0.40;
    const sc = 0.7 + tw*0.4;
    s.scale.set(sc, sc, sc);
  });

  fgStars.forEach(s => {
    s.position.z += s.userData.speed;
    if (s.position.z > 4) s.position.z = -14 - Math.random()*6;
    const tw = 0.4 + 0.6*Math.sin(tLoop*s.userData.freq + s.userData.phase);
    s.material.opacity = tw * (0.55 + pulse*0.25);
    const sc = 0.5 + tw*0.5 + pulse*0.25;
    s.scale.set(sc, sc, sc);
  });

  const dpos = dust.geometry.attributes.position.array;
  for (let i = 0; i < dustCount; i++) {
    dpos[i*3+2] += dustUserData[i].spd;
    if (dpos[i*3+2] > 5) dpos[i*3+2] = -17;
  }
  dust.geometry.attributes.position.needsUpdate = true;

  const fpos = fastDust.geometry.attributes.position.array;
  for (let i = 0; i < fastCount; i++) {
    fpos[i*3+2] += fastData[i].spd;
    if (fpos[i*3+2] > 2) fpos[i*3+2] = -7;
    const swirl = fastData[i].swirl;
    const c = Math.cos(swirl), s = Math.sin(swirl);
    const x = fpos[i*3], y = fpos[i*3+1];
    fpos[i*3]   = x*c - y*s;
    fpos[i*3+1] = x*s + y*c;
  }
  fastDust.geometry.attributes.position.needsUpdate = true;

  camera.position.x = Math.sin(tLoop*0.40)*0.07 + Math.sin(tLoop*2.3)*0.04 + Math.sin(tLoop*5.1)*0.02;
  camera.position.y = Math.cos(tLoop*0.32)*0.07 + Math.cos(tLoop*1.8)*0.04 + Math.cos(tLoop*4.3)*0.02;
  camera.lookAt(Math.sin(tLoop*0.22)*0.20, Math.cos(tLoop*0.18)*0.20, -3);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
