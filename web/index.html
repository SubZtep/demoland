<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>▦</title>
    <link rel="preload" href="/Mona-Sans.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    Hello, World!
    <canvas id="myCanvas" width="200" height="100" style="border: 1px solid #ffff00"> </canvas>
    <script>
      var c = document.getElementById("myCanvas")
      var ctx = c.getContext("2d")
      ctx.moveTo(0, 0)
      ctx.lineTo(200, 100)
      ctx.strokeStyle = "red"
      ctx.stroke()
    </script>
    <div id="app"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
